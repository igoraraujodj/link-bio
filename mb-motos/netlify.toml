# Publicação no Netlify (grátis), para o site ganhar um endereço sem o nome
# do Igor. No painel do Netlify, ao conectar este repositório:
#
#   Base directory:      mb-motos
#   Build command:       (deixe vazio, o site não tem build)
#   Publish directory:   mb-motos
#
# Depois, em Site configuration → Change site name, defina "mbmotos" e o
# endereço vira https://mbmotos.netlify.app

[build]
  publish = "."
  command = ""

# Cache longo para os arquivos que raramente mudam, sem cachear o HTML:
# assim uma alteração de conteúdo aparece na hora para quem já visitou.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
