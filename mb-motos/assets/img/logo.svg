     basta trocar este SVG mantendo o nome do arquivo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 128" role="img" aria-label="MB Motos">
  <g transform="skewX(-11)">
    <!-- faixa amarela atrás do lettering -->
    <rect x="34" y="16" width="252" height="62" rx="4" fill="#FFE000"/>
    <text x="52" y="70" font-family="'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="66" font-weight="900" letter-spacing="-2"
          fill="#E30613" stroke="#FFE000" stroke-width="7" paint-order="stroke" stroke-linejoin="round">MB</text>
    <text x="54" y="112" font-family="'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="31" font-weight="900" letter-spacing="7" fill="#FFFFFF">MOTOS</text>
  </g>
